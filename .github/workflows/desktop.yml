name: Desktop development builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[desktop,windows,mac]' pyinstaller
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python scripts/build_desktop.py
      - run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaygoDesktop-${{ matrix.os }}
          path: dist/installers/
