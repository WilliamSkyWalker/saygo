name: Publish desktop artifacts
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag receiving the desktop artifacts
        type: string
        required: true
      build_run_id:
        description: Desktop development builds run to download
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: desktop-assets
      - name: Upload desktop assets without replacing existing files
        run: gh release upload "$RELEASE_TAG" desktop-assets/*/*
