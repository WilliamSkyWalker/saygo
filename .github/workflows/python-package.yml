name: Python package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (optional)
        type: string
        default: ''
      publish:
        description: Package index (build only by default)
        type: choice
        options: [none, testpypi, pypi]
        default: none
permissions:
  contents: read
concurrency:
  group: python-package-${{ github.ref }}-${{ inputs.publish || 'pypi' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --outdir dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/python/*
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
