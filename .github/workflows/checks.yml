name: Core and browser regression checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  mcp-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 'mcp==1.2.0'
            # MCP 1.2 imports a private Pydantic helper removed in 2.14.
            pydantic: 'pydantic==2.13.5'
          - sdk: 'mcp>=1.2,<3'
            pydantic: 'pydantic>=2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the selected MCP SDK
        env:
          SDK_SPEC: ${{ matrix.sdk }}
          PYDANTIC_SPEC: ${{ matrix.pydantic }}
        run: python -m pip install . "$SDK_SPEC" "$PYDANTIC_SPEC"
      - name: Verify stdio profiles and input schemas
        run: python scripts/check_mcp_stdio.py
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[mcp,browser,desktop,qa,selenium,mobile]'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Require the Qt test dependency to load
        run: python -c "from PySide6.QtWidgets import QApplication"
      - run: python scripts/check_core_tests.py
      - run: node --test tests/extension_demo/test_*.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Revalidate immutable release source with corrected browser checks.
      # Only validation files come from the caller; product source stays at ref.
      - name: Use current browser checks for an existing release tag
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.ref, 'refs/tags/') && inputs.ref != github.ref
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git rev-parse HEAD
          git fetch --no-tags origin "$VALIDATION_SHA"
          git restore --source=FETCH_HEAD -- tests/browser_demo/test_playwright_live.py
          git diff --stat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[mcp,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb openbox x11-utils
      - name: Real extension, native host, background capture and scrolling
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python scripts/check_browser_tests.py
  bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - name: Native host IPC, shared installation discovery and Windows file sharing
        run: |
          python -m unittest discover -s tests/extension_demo -p test_bridge.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/extension_demo -p test_shared_bridge.py -v
